server.port=8082

spring.application.name=productos-app

# connectTimeout: segundos máximos para abrir la conexión TCP con PostgreSQL
# socketTimeout: segundos máximos esperando respuesta de una consulta ya enviada
spring.datasource.url=jdbc:postgresql://localhost:5432/trigg_db?connectTimeout=5&socketTimeout=30
spring.datasource.username=postgres
spring.datasource.password=123456

# Tiempo máximo (ms) que una petición espera una conexión del pool (Hikari).
# Si la base no responde, falla a los 5 s en vez de los 30 s por defecto -> 503.
spring.datasource.hikari.connection-timeout=5000

# Dialecto fijo: Hibernate no necesita consultar la base al arrancar, así la app
# levanta aunque PostgreSQL esté caído y responde 503 hasta que vuelva.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# La tabla productos ya existe en trigg_db (con vistas y triggers)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
